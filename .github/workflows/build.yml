name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Clean Android Platform
        run: |
          rm -rf android
          flutter create . --project-name football --platforms=android --org com.example
          mkdir -p android/app
          cp google-services.json android/app/

      - name: Set App Name To ملعبي
        run: |
          sed -i 's/android:label="football"/android:label="ملعبي"/g' android/app/src/main/AndroidManifest.xml

      - name: Inject Android Queries For Phone and WhatsApp
        run: |
          # إضافة تصاريح فحص تطبيقات الاتصال والواتساب لنظام أندرويد 11 فما فوق
          sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.DIAL" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

      - name: Generate Football Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          curl -s -L -o ball.png "https://cdn-icons-png.flaticon.com/512/861/861512.png"
          for dir in android/app/src/main/res/mipmap-*; do
            convert ball.png -resize 192x192 "$dir/ic_launcher.png"
          done

      - name: Inject Firebase Gradle Config
        run: |
          sed -i '/id "org.jetbrains.kotlin.android"/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
