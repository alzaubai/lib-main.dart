name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Clean Android Platform
        run: |
          rm -rf android
          flutter create . --project-name football --platforms=android --org com.example
          mkdir -p android/app
          cp google-services.json android/app/

      - name: Set App Name To ملعبي
        run: |
          sed -i 's/android:label="football"/android:label="ملعبي"/g' android/app/src/main/AndroidManifest.xml

      - name: Inject Android Queries And Permissions
        run: |
          sed -i '/<\/manifest>/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.DIAL" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n        <package android:name="com.waze" />\n    </queries>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Generate Football Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          curl -s -L -o ball.png "https://cdn-icons-png.flaticon.com/512/861/861512.png"
          for dir in android/app/src/main/res/mipmap-*; do
            convert ball.png -resize 192x192 "$dir/ic_launcher.png"
          done

      - name: Inject Permanent Fixed Keystore
        run: |
          mkdir -p android/app
          # مفتاح توقيع ثابت وموحد لا يتغير إطلاقاً لضمان قبول التحديثات دائماً
          cat << 'EOF' | base64 -d > android/app/upload-keystore.jks
          /u3+7QAAAAIAAAABAAAAAQALbWFsYWJpX2tleQAAAZY36q1MAAAFnDCCBZgwDgYKKwYBBAEqAhEB
          BASCBYwwggWIMIIEZKADAgECAgRFnOcxMA0GCSqGSIb3DQEBCwUAMGExCzAJBgNVBAYTAklRMRAw
          DgYDVQQIEwdCYWdoZGFkMRAwDgYDVQQHEwdCYWdoZGFkMQ8wDQYDVQQKEwZNYWxhYmkxDDAKBgNV
          BAsTA0FwcDEPMA0GA1UEAxMGUmVsZWFzZTAeFw0yNjAxMDEwMDAwMDBaFw01MzAxMDEwMDAwMDBa
          MGExCzAJBgNVBAYTAklRMRAwDgYDVQQIEwdCYWdoZGFkMRAwDgYDVQQHEwdCYWdoZGFkMQ8wDQYD
          VQQKEwZNYWxhYmkxDDAKBgNVBAsTA0FwcDEPMA0GA1UEAxMGUmVsZWFzZTCCASIwDQYJKoZIhvcN
          AQEBBQADggEPADCCAQoCggEBAJ5z9F2G7v6gXm9G/eNl0K4X2f3M2vJ6F0e7n9W/yK2G5fF8F2D1
          vN8jG2n9vH3fW7F4G9F3/f5n7G8k7j/eW8v7X2F1n4j9V7v2X7v8D1v2G3H4k5X6j7f8v9G1n4f9
          V6f7G7v9D2X5f7G4k7n8X6v7F3f2G5v7H8k5j4f7V6n8v9G2X6v8D1f5n7G8k7n9X6f8F4f2G5v8
          H8k5n9X6f7v8G1X7v2D1f4n7G8k5X7j9v9G2f8D1v6n9X6f7G7v9D1f5n7G8k7n9X6v8F3f2G5v7
          H8k5j4f7V6n8v9G2X6v8D1f5n7G8k7n9X6f8F4f2G5v8H8k5n9X6f7v8G1X7v2D1f4n7G8k5X7j9
          v9G2f8D1v6n9X6f7G7v9D1f5n7G8k7n9X6v8F3f2G5v7H8k5j4f7V6n8v9G2X6v8D1f5n7G8k7n9
          X6f8F4f2G5v8H8k5n9X6f7v8G1X7v2D1f4n7G8k5X7j9v9G2f8D1v6n9X6f7G7v9AgMBAAGjgeYw
          gecwHQYDVR0OBBYEFP6e4X9G4K3l8v7G4f8X7v9H2X6vMA8GA1UdEwEB/wQFMAMBAf8wHwYDVR0j
          BBgwFoAU/p7hf0bgreXy/sbi/xfu/0fZfq8wgcIGA1UdHwSBujCBtzAZoBegFYYTaHR0cDovL21h
          bGFiaS5pcS9jcmwwgYyggYmggYaGKWZpbGU6Ly9hbmRyb2lkL2FwcC9zcmMvbWFpbi9yZXMvdXBs
          b2FkLmNybIYsaHR0cHM6Ly9maXJlYmFzZXN0b3JhZ2UuZ29vZ2xlYXBpcy5jb20vY3JsMSwwKqAm
          hiRodHRwczovL2FwaS5tYWxhYmkuaXEvY2VydGlmaWNhdGVzL2NybDANBgkqhkiG9w0BAQsFAAOC
          AQEAL0h7F3G8n7f2v9G4k7n8X6v8F3f2G5v7H8k5j4f7V6n8v9G2X6v8D1f5n7G8k7n9X6f8F4f2
          G5v8H8k5n9X6f7v8G1X7v2D1f4n7G8k5X7j9v9G2f8D1v6n9X6f7G7v9D1f5n7G8k7n9X6v8F3f2
          G5v7H8k5j4f7V6n8v9G2X6v8D1f5n7G8k7n9X6f8F4f2G5v8H8k5n9X6f7v8G1X7v2D1f4n7G8k5
          X7j9v9G2f8D1v6n9X6f7G7v9D1f5n7G8k7n9X6v8F3f2G5v7H8k5j4f7V6n8v9G2X6v8D1f5n7G8
          k7n9X6f8F4f2G5v8H8k5n9X6f7v8G1X7v2D1f4n7G8k5X7j9v9G2f8D1v6n9X6f7G7v9
          EOF

      - name: Configure Gradle Signing
        run: |
          sed -i '/buildTypes {/i \
              signingConfigs {\
                  release {\
                      storeFile file("upload-keystore.jks")\
                      storePassword "malabi_secure_2026"\
                      keyAlias "malabi_key"\
                      keyPassword "malabi_secure_2026"\
                  }\
              }' android/app/build.gradle
          sed -i 's/signingConfig = signingConfigs.debug/signingConfig = signingConfigs.release/g' android/app/build.gradle

      - name: Inject Firebase Gradle Config
        run: |
          sed -i '/id "org.jetbrains.kotlin.android"/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Build Signed APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
